name: Secret scan

on:
  push:
  pull_request:

jobs:
  forbidden-files:
    name: Block credential / local-config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any secret-bearing file is tracked
        run: |
          set -uo pipefail
          # Files that must never be committed. config.example.json is allowed.
          pattern='(^|/)(config\.local\.[^/]+|[^/]*\.env|\.env\..*|credentials|aws-credentials.*|[^/]*\.pem|[^/]*\.p8|[^/]*\.local\.plist)$|(^|/)\.aws/'
          hits="$(git ls-files | grep -E "$pattern" || true)"
          if [ -n "$hits" ]; then
            echo "::error::Credential or local-config file(s) are tracked in git:"
            echo "$hits"
            echo "Remove the file, add it to .gitignore, and scrub it from history before merging."
            exit 1
          fi
          echo "OK — no credential/local-config files tracked."

  content-scan:
    name: Scan content for secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
